# ==============================================================================
# entity-persistence-base-orchestrator — application.properties
#
# All keys that are relevant for production deployment can be overridden via
# environment variables using the MicroProfile Config convention:
#   property.key  →  PROPERTY_KEY  (dots and hyphens become underscores, upper-cased)
#
# Examples:
#   backend.base-url  →  BACKEND_BASE_URL
#
# EPBO is a stateless compute layer — no Redis client, no caching, no locking.
# ==============================================================================

# ------------------------------------------------------------------------------
# Quarkus HTTP server
# EPBO listens on 3002 — sits between EPG (:8081) and EPC (:3001)
# ------------------------------------------------------------------------------
quarkus.http.port=3002

# Override via: QUARKUS_HTTP_PORT

# ------------------------------------------------------------------------------
# Backend target — entity-persistence-cache (EPC)
#
# All proxied requests are forwarded to EPC on :3001.
# It must NOT have a trailing slash.
# ------------------------------------------------------------------------------
backend.base-url=http://localhost:3001

# Override via environment variable:
# backend.base-url=${BACKEND_BASE_URL:http://localhost:3001}

# ------------------------------------------------------------------------------
# Backend reachability check (startup)
#
# The application probes EPC before finishing startup.
# If the probe fails (connection refused, timeout, or HTTP 5xx), the
# application aborts with a clear error message.
#
# Override via:
#   BACKEND_HEALTH_CHECK_ENABLED          (true / false)
#   BACKEND_HEALTH_CHECK_PATH             (e.g. /ping)
#   BACKEND_HEALTH_CHECK_TIMEOUT_SECONDS  (integer)
# ------------------------------------------------------------------------------
backend.health-check.enabled=true
backend.health-check.path=/ping
backend.health-check.openapi-path=/openapi.json
backend.health-check.timeout-seconds=10

# ------------------------------------------------------------------------------
# Apache Camel
# ------------------------------------------------------------------------------
camel.context.name=entity-persistence-base-orchestrator

# Camel HTTP component — default socket/connection timeouts for backend calls (ms)
camel.component.http.connection-time-to-live=60000
camel.component.http.so-timeout=30000
camel.component.http.connect-timeout=5000

# ------------------------------------------------------------------------------
# OpenTelemetry — distributed tracing
#
# W3C Trace Context (traceparent / tracestate) is the default propagator.
# B3 is added so APM tools like Instana can also pick up the spans.
# ------------------------------------------------------------------------------
quarkus.otel.sdk.disabled=false

# OTLP exporter endpoint — override with your collector URL
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317

# Propagators: W3C TraceContext + Baggage
quarkus.otel.propagators=tracecontext,baggage

# Service name shown in your APM tool
quarkus.otel.resource.attributes=service.name=entity-persistence-base-orchestrator

# Override via:
# quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.min-level=TRACE
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."io.tarcinapp".level=DEBUG
quarkus.log.category."io.tarcinapp.epbo.TraceLoggingRouteBuilder".level=TRACE

# Camel route tracing log (set to TRACE for full Exchange dump during development)
quarkus.log.category."org.apache.camel.tracing".level=INFO

# ------------------------------------------------------------------------------
# Dev-mode overrides (%dev profile)
# ------------------------------------------------------------------------------
%dev.backend.base-url=http://localhost:3001
%dev.quarkus.otel.sdk.disabled=true
%dev.quarkus.observability.lgtm.enabled=false
%dev.quarkus.live-reload.port=8183

# Disable Camel Debugger JMX connector in dev mode.
# EPC also runs on the same machine in quarkus:dev and registers jmxrmi/camel at
# RMI port 1099 first. A second Camel JMX connector on the same host collides with
# a NameAlreadyBoundException. Disabling it here prevents the WARN and the failed
# bind attempt. Camel route debugging can still be done via the Camel CLI and the
# quarkus dev UI at /q/dev without the JMX connector.
%dev.camel.debug.enabled=false

# ------------------------------------------------------------------------------
# Test-mode overrides (%test profile)
# ------------------------------------------------------------------------------
%test.quarkus.otel.sdk.disabled=true
%test.backend.base-url=http://localhost:3001
%test.backend.health-check.enabled=false
